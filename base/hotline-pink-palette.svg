<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="titleGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#FF1493"/>
      <stop offset="0.55" stop-color="#FF00A8"/>
      <stop offset="1" stop-color="#2DE2E6"/>
    </linearGradient>
    <radialGradient id="ambientPink" cx="0.88" cy="0.08" r="0.7">
      <stop offset="0" stop-color="#FF1493" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .sans { font-family: 'DejaVu Sans', sans-serif; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; }
      .label { font: 600 21px 'DejaVu Sans', sans-serif; fill: #FFF4FA; }
      .hex { font: 17px 'DejaVu Sans Mono', monospace; fill: #B8AAB2; letter-spacing: 0.5px; }
      .section { font: 700 16px 'DejaVu Sans', sans-serif; fill: #FF5CB8; letter-spacing: 3px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#09090B"/>
  <rect width="1600" height="1000" fill="url(#ambientPink)"/>
  <path d="M0 860 L480 380 L720 620 L1030 310 L1600 880" fill="none" stroke="#FF1493" stroke-opacity="0.035" stroke-width="2"/>
  <path d="M0 920 L520 400 L770 650 L1080 340 L1600 860" fill="none" stroke="#2DE2E6" stroke-opacity="0.035" stroke-width="2"/>

  <g transform="translate(92 76)">
