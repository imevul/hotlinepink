      <text x="22" y="141" class="mono" font-size="17" fill="#09090B">#FF1493</text>
    </g>
    <g transform="translate(279 25)">
      <rect width="260" height="166" rx="18" fill="#FF5CB8"/>
      <text x="22" y="112" class="sans" font-size="20" font-weight="700" fill="#09090B">Highlight</text>
      <text x="22" y="141" class="mono" font-size="17" fill="#09090B">#FF5CB8</text>
    </g>
    <g transform="translate(558 25)">
