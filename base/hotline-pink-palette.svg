    <text x="38" y="51" class="sans" font-size="62" font-weight="800" fill="#FFF4FA" letter-spacing="-2">HOTLINE PINK</text>
    <text x="40" y="92" class="mono" font-size="19" fill="#B8AAB2" letter-spacing="2">DARK SYNTHWAVE SYSTEM • OPENCODE / HERMES / HERDR</text>
  </g>

  <g transform="translate(92 230)">
    <text x="0" y="0" class="section">FOUNDATION</text>
    <g transform="translate(0 25)" filter="url(#softShadow)">
      <rect width="444" height="206" rx="20" fill="#121214" stroke="#49313E"/>
      <rect x="18" y="18" width="408" height="112" rx="13" fill="#09090B"/>
      <text x="28" y="166" class="label">Background</text><text x="278" y="166" class="hex">#09090B</text>
      <rect x="28" y="181" width="270" height="5" rx="2.5" fill="#09090B" stroke="#49313E"/>
    </g>
    <g transform="translate(466 25)" filter="url(#softShadow)">
      <rect width="444" height="206" rx="20" fill="#121214" stroke="#49313E"/>
      <rect x="18" y="18" width="408" height="112" rx="13" fill="#121214" stroke="#282329"/>
      <text x="28" y="166" class="label">Surface</text><text x="278" y="166" class="hex">#121214</text>
      <rect x="28" y="181" width="270" height="5" rx="2.5" fill="#121214" stroke="#49313E"/>
    </g>
    <g transform="translate(932 25)" filter="url(#softShadow)">
      <rect width="444" height="206" rx="20" fill="#121214" stroke="#49313E"/>
      <rect x="18" y="18" width="408" height="112" rx="13" fill="#1C191C"/>
