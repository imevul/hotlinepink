    <g transform="translate(0 24)"><rect width="192" height="92" rx="15" fill="#FFF4FA"/><text x="18" y="40" class="sans" font-size="17" font-weight="700" fill="#09090B">Text</text><text x="18" y="68" class="mono" font-size="15" fill="#09090B">#FFF4FA</text></g>
    <g transform="translate(210 24)"><rect width="192" height="92" rx="15" fill="#B8AAB2"/><text x="18" y="40" class="sans" font-size="17" font-weight="700" fill="#09090B">Muted</text><text x="18" y="68" class="mono" font-size="15" fill="#09090B">#B8AAB2</text></g>
    <g transform="translate(420 24)"><rect width="192" height="92" rx="15" fill="#49313E"/><text x="18" y="40" class="sans" font-size="17" font-weight="700" fill="#FFF4FA">Border</text><text x="18" y="68" class="mono" font-size="15" fill="#FFF4FA">#49313E</text></g>

    <text x="676" y="0" class="section">SEMANTIC STATUS</text>
    <g transform="translate(676 24)"><rect width="212" height="92" rx="15" fill="#22C55E"/><text x="18" y="40" class="sans" font-size="17" font-weight="700" fill="#09090B">Success</text><text x="18" y="68" class="mono" font-size="15" fill="#09090B">#22C55E</text></g>
    <g transform="translate(906 24)"><rect width="212" height="92" rx="15" fill="#F59E0B"/><text x="18" y="40" class="sans" font-size="17" font-weight="700" fill="#09090B">Warning</text><text x="18" y="68" class="mono" font-size="15" fill="#09090B">#F59E0B</text></g>
    <g transform="translate(1136 24)"><rect width="240" height="92" rx="15" fill="#EF4444"/><text x="18" y="40" class="sans" font-size="17" font-weight="700" fill="#FFF4FA">Error</text><text x="18" y="68" class="mono" font-size="15" fill="#FFF4FA">#EF4444</text></g>
  </g>

  <g transform="translate(92 921)">
    <rect width="1376" height="1" fill="#49313E"/>
    <text x="0" y="39" class="mono" font-size="16" fill="#B8AAB2">BALANCE</text>
    <rect x="110" y="24" width="840" height="18" rx="9" fill="#09090B" stroke="#49313E"/>
    <rect x="110" y="24" width="672" height="18" rx="9" fill="#1C191C"/>
    <rect x="782" y="24" width="143" height="18" fill="#FF1493"/>
    <rect x="925" y="24" width="25" height="18" rx="0 9 9 0" fill="#2DE2E6"/>
    <text x="976" y="40" class="mono" font-size="15" fill="#FFF4FA">80% charcoal</text>
    <text x="1120" y="40" class="mono" font-size="15" fill="#FF5CB8">17% pink</text>
    <text x="1240" y="40" class="mono" font-size="15" fill="#2DE2E6">3% cyan</text>
