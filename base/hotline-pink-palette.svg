      <text x="22" y="141" class="mono" font-size="17" fill="#FFF4FA">#C6006F</text>
    </g>
    <g transform="translate(1116 25)">
      <rect width="260" height="166" rx="18" fill="#2DE2E6"/>
      <text x="22" y="112" class="sans" font-size="20" font-weight="700" fill="#09090B">Cyan</text>
      <text x="22" y="141" class="mono" font-size="17" fill="#09090B">#2DE2E6</text>
    </g>
  </g>

  <g transform="translate(92 745)">
