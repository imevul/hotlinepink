      <text x="22" y="112" class="sans" font-size="20" font-weight="700" fill="#09090B">Magenta</text>
      <text x="22" y="141" class="mono" font-size="17" fill="#09090B">#FF00A8</text>
    </g>
    <g transform="translate(837 25)">
