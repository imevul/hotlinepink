# One table per app. status is "loaded" (opened in the real app) or "syntax"
# (parsed or validated only). Destinations with only_if only install when that
# path exists.

[ghostty]
name = "Ghostty"
group = "Terminals"
summary = "Colour theme for Ghostty."
status = "loaded"
files = [{ src = "hotline-pink", dest = ["~/.config/ghostty/themes/hotline-pink"] }]
activate = "Add `theme = hotline-pink` to your Ghostty config, then reload it."
notes = """
Colour settings in your own config override the theme. Remove any `background`, `foreground`, `cursor-color`, `cursor-text`, `selection-*` and `palette` lines, or the theme will appear to do nothing.
"""

[konsole]
name = "Konsole"
group = "Terminals"
summary = "Colour scheme for Konsole."
status = "loaded"
files = [{ src = "HotlinePink.colorscheme", dest = ["~/.local/share/konsole/HotlinePink.colorscheme"] }]
activate = "Settings > Edit Current Profile > Appearance, then pick Hotline Pink."
notes = "Konsole colour schemes can't set a cursor colour, so the cursor follows the text colour unless you set a custom one in the profile."

[alacritty]
name = "Alacritty"
group = "Terminals"
summary = "Colour theme for Alacritty."
status = "syntax"
files = [{ src = "hotline-pink.toml", dest = ["~/.config/alacritty/themes/hotline-pink.toml"] }]
activate = """
Add this to `alacritty.toml`:

```toml
[general]
import = ["~/.config/alacritty/themes/hotline-pink.toml"]
```
"""

[windows-terminal]
name = "Microsoft Terminal"
group = "Terminals"
summary = "Colour scheme for Windows Terminal."
status = "syntax"
manual = true
files = [{ src = "hotline-pink.json", dest = [] }]
activate = """
Open Settings > Open JSON file and add the contents of `hotline-pink.json` to the `schemes` array. Then set `"colorScheme": "Hotline Pink"` under `profiles.defaults`.
"""

[zsh-p10k]
name = "zsh + Powerlevel10k"
group = "Shells"
summary = "A small lean Powerlevel10k prompt in Hotline Pink colours."
status = "loaded"
files = [{ src = "p10k.zsh", dest = ["~/.p10k.zsh"] }]
activate = "Open a new shell. Your `.zshrc` needs to source `~/.p10k.zsh`, as the Powerlevel10k setup does by default."
notes = """
Installing replaces `~/.p10k.zsh`, after backing up any existing file. To keep your own prompt layout, skip the installer and copy the block between the `hotline pink colours` markers to the end of the main function in your config.

Needs a Nerd Font. JetBrains Mono Nerd Font is the recommended choice.
"""

[fish]
name = "fish + Tide"
group = "Shells"
summary = "Syntax colours for fish, and colours for the Tide prompt."
status = "syntax"
files = [
  { src = "Hotline Pink.theme", dest = ["~/.config/fish/themes/Hotline Pink.theme"] },
  { src = "tide-colors.fish", dest = ["~/.config/fish/hotline-pink-tide-colors.fish"] },
]
activate = """
```fish
fish_config theme choose "Hotline Pink"
fish ~/.config/fish/hotline-pink-tide-colors.fish
```

Skip the second line if you don't use Tide. `theme choose` only lasts for the current session, so add that line to `config.fish` to keep the theme.
"""
notes = """
The installer saves your current Tide colours first. `./install.py --uninstall fish` restores any colour still set to its Hotline Pink value, and leaves colours you changed since then alone.
"""

[btop]
name = "btop"
group = "TUI tools"
summary = "Theme for btop."
status = "syntax"
files = [{ src = "hotline-pink.theme", dest = ["~/.config/btop/themes/hotline-pink.theme"] }]
activate = "Press Esc in btop, open Options, and set Color theme to hotline-pink."

[bat]
name = "bat"
group = "TUI tools"
summary = "Syntax theme for bat. delta uses it too."
status = "loaded"
files = [{ src = "hotline-pink.tmTheme", dest = ["~/.config/bat/themes/hotline-pink.tmTheme"] }]
activate = """
```bash
bat cache --build
```

Then add `--theme="hotline-pink"` to `~/.config/bat/config`.
"""

[delta]
name = "delta"
group = "TUI tools"
summary = "Diff colours for delta."
status = "syntax"
files = [{ src = "hotline-pink.gitconfig", dest = ["~/.config/delta/hotline-pink.gitconfig"] }]
activate = """
```bash
git config --global include.path ~/.config/delta/hotline-pink.gitconfig
```

```bash
git config --global delta.features hotline-pink
```
"""
notes = "Install the bat theme first, because `syntax-theme` points to it."

[fzf]
name = "fzf"
group = "TUI tools"
summary = "Colour options for fzf, for fish and zsh."
status = "syntax"
files = [
  { src = "hotline-pink.fish", dest = ["~/.config/fzf/hotline-pink.fish"] },
  { src = "hotline-pink.zsh", dest = ["~/.config/fzf/hotline-pink.zsh"] },
]
activate = "Source `~/.config/fzf/hotline-pink.fish` from `config.fish`, or `~/.config/fzf/hotline-pink.zsh` from `.zshrc`."

[eza]
name = "eza"
group = "TUI tools"
summary = "Theme for eza."
status = "loaded"
files = [{ src = "theme.yml", dest = ["~/.config/eza/theme.yml"] }]
activate = "Nothing to do, eza reads this file automatically. An `LS_COLORS` or `EZA_COLORS` variable can still override it."

[micro]
name = "micro"
group = "TUI tools"
summary = "Colour scheme for micro."
status = "syntax"
files = [{ src = "hotline-pink.micro", dest = ["~/.config/micro/colorschemes/hotline-pink.micro"] }]
activate = "In micro, press Ctrl+E and run `set colorscheme hotline-pink`."

[superfile]
name = "superfile"
group = "TUI tools"
summary = "Theme for superfile."
status = "syntax"
files = [{ src = "hotline-pink.toml", dest = ["~/.config/superfile/theme/hotline-pink.toml"] }]
activate = "Set `theme = \"hotline-pink\"` in `~/.config/superfile/config.toml`."

[vscode]
name = "VS Code / Cursor"
group = "Editors"
summary = "Colour theme extension for VS Code, Code - OSS and Cursor."
status = "loaded"
files = [
  { src = "hotline-pink/package.json", dest = ["~/.vscode/extensions/imevul.hotline-pink-1.0.0/package.json", "~/.vscode-oss/extensions/imevul.hotline-pink-1.0.0/package.json", "~/.cursor/extensions/imevul.hotline-pink-1.0.0/package.json"], only_if = ["~/.vscode", "~/.vscode-oss", "~/.cursor"] },
  { src = "hotline-pink/themes/hotline-pink-color-theme.json", dest = ["~/.vscode/extensions/imevul.hotline-pink-1.0.0/themes/hotline-pink-color-theme.json", "~/.vscode-oss/extensions/imevul.hotline-pink-1.0.0/themes/hotline-pink-color-theme.json", "~/.cursor/extensions/imevul.hotline-pink-1.0.0/themes/hotline-pink-color-theme.json"], only_if = ["~/.vscode", "~/.vscode-oss", "~/.cursor"] },
]
activate = "Restart the editor, then choose Preferences: Color Theme > Hotline Pink."
notes = "Opened in Code - OSS. Cursor uses the same extension format but hasn't been opened with it yet."

[kate]
name = "Kate"
group = "Editors"
summary = "Syntax highlighting theme for Kate and other KDE text editors."
status = "loaded"
files = [{ src = "hotline-pink.theme", dest = ["~/.local/share/org.kde.syntax-highlighting/themes/hotline-pink.theme"] }]
activate = "Restart Kate, then pick Hotline Pink under Settings > Configure Kate > Color Themes."

[jetbrains]
name = "JetBrains IDEs"
group = "Editors"
summary = "Editor colour scheme for JetBrains IDEs. It covers the editor only, not the IDE UI."
status = "syntax"
manual = true
files = [{ src = "HotlinePink.icls", dest = [] }]
activate = "Settings > Editor > Color Scheme, then the gear icon > Import Scheme, and choose `HotlinePink.icls`."

[kde-plasma]
name = "KDE Plasma"
group = "Desktop"
summary = "Plasma colour scheme for apps and window decorations."
status = "syntax"
files = [{ src = "HotlinePink.colors", dest = ["~/.local/share/color-schemes/HotlinePink.colors"] }]
activate = "```bash\nplasma-apply-colorscheme HotlinePink\n```"
notes = "kde-material-you-colors replaces the active colour scheme while it runs, so stop it first if you use it."

[opencode]
name = "opencode"
group = "Agent tools"
summary = "TUI theme for opencode."
status = "syntax"
files = [{ src = "hotline-pink.json", dest = ["~/.config/opencode/themes/hotline-pink.json"] }]
activate = "Add `\"theme\": \"hotline-pink\"` to `tui.json` or `tui.jsonc`, or pick it with `/theme`."

[herdr]
name = "herdr"
group = "Agent tools"
summary = "Colour overrides for herdr's UI."
status = "syntax"
manual = true
files = [{ src = "theme.toml", dest = [] }]
activate = """
herdr keeps theme colours in its main config, so this one is a paste. Replace the `[theme]` table in `~/.config/herdr/config.toml` with `theme.toml`, then run:

```bash
herdr server reload-config
```
"""
