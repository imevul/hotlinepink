# Hotline Pink for Alacritty
[colors.primary]
background = "{{bg}}"
foreground = "{{text}}"

[colors.cursor]
text = "{{bg}}"
cursor = "{{cursor}}"

[colors.selection]
text = "{{selection-fg}}"
background = "{{selection-bg}}"

[colors.normal]
black = "{{ansi-black}}"
red = "{{ansi-red}}"
green = "{{ansi-green}}"
yellow = "{{ansi-yellow}}"
blue = "{{ansi-blue}}"
magenta = "{{ansi-magenta}}"
cyan = "{{ansi-cyan}}"
white = "{{ansi-white}}"

[colors.bright]
black = "{{ansi-bright-black}}"
red = "{{ansi-bright-red}}"
green = "{{ansi-bright-green}}"
yellow = "{{ansi-bright-yellow}}"
blue = "{{ansi-bright-blue}}"
magenta = "{{ansi-bright-magenta}}"
cyan = "{{ansi-bright-cyan}}"
white = "{{ansi-bright-white}}"
